<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b45"><title>Kota Connect | Live Order Tracking</title><style>
:root{font-family:system-ui,Arial;color:#183b2b;background:#f4f8f4}*{box-sizing:border-box}body{margin:0}header{background:#176b45;color:white;padding:20px}main{max-width:650px;margin:24px auto;padding:12px}.card{background:white;border:1px solid #dce7df;border-radius:16px;padding:22px;box-shadow:0 6px 24px #123d2b10}input,button,a.button{font:inherit;padding:12px;border-radius:9px}input{width:100%;border:1px solid #bbcfc1}button,a.button{display:inline-block;background:#176b45;color:white;border:0;text-decoration:none;cursor:pointer;margin-top:12px}#status{font-size:1.4rem;font-weight:700;color:#176b45}li{padding:8px;color:#68766c}li.done{color:#176b45;font-weight:700}#notice{background:#fff6db;padding:12px;border-radius:9px}#details{white-space:pre-line;overflow-wrap:anywhere}</style>
<link rel="stylesheet" href="premium.css"></head><body><header><strong>🥪 Kota Connect</strong> · Live order tracking</header><main><div class="card"><h1>Track your kota</h1><p>Orders are private to the device/browser account that placed them. Keep using the same browser.</p><label for="orderId">Order tracking ID</label><input id="orderId" autocomplete="off" placeholder="Paste your tracking ID"><button id="track">Track order</button><p id="notice" role="status">Connecting…</p><h2 id="status"></h2><p id="details"></p><ol id="steps"></ol><a class="button" href="index.html">Order again</a></div></main>
<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const config={apiKey:"AIzaSyCxaY076gfNUfE3OzxkDJZ5xAdmLEuJzgs",authDomain:"kasikota-hub.firebaseapp.com",projectId:"kasikota-hub",appId:"1:470531130099:web:1bf117b7adf7a3a3d7ed86"};
const app=getApps().find(x=>x.name==="KotaConnectGuestOrders")||initializeApp(config,"KotaConnectGuestOrders"),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),steps=["pending","accepted","preparing","ready_for_collection","out_for_delivery","completed"];
const labels={pending:"Order received",accepted:"Accepted by shop",preparing:"Preparing your kota",ready_for_collection:"Ready for collection",out_for_delivery:"Out for delivery",completed:"Completed",rejected:"Rejected",delayed:"Delayed"};
let stop=null;
function render(order){const status=order.orderStatus||"pending";$("status").textContent=labels[status]||status;$("notice").textContent="Live updates connected";$("details").textContent="Order: "+(order.orderNumber||"—")+"\nShop: "+(order.shopName||"—")+"\n"+(order.ownerNote||"")+(order.delayMinutes?"\nExtra waiting time: "+order.delayMinutes+" minutes":"")+(order.confirmedTotal!=null?"\nConfirmed total: R"+Number(order.confirmedTotal).toFixed(2):"\nPrice awaiting shop confirmation");const list=$("steps");list.replaceChildren();const visibleSteps=steps.filter(k=>!(k==="out_for_delivery"&&order.fulfillmentType!=="delivery"||k==="ready_for_collection"&&order.fulfillmentType==="delivery"));const idx=visibleSteps.indexOf(status);for(const [i,k] of visibleSteps.entries()){const li=document.createElement("li");li.textContent=labels[k];if(i<=idx&&idx>=0)li.className="done";list.append(li)}}
function clearTracking(){ $("status").textContent="";$("details").textContent="";$("steps").replaceChildren() }
function track(){clearTracking();if(!auth.currentUser){$("notice").textContent="Connecting to your customer session…";return}const id=$("orderId").value.trim();if(!/^[A-Za-z0-9_-]{10,128}$/.test(id)){$("notice").textContent="Enter the tracking ID from your order confirmation.";return}if(stop){stop();stop=null}history.replaceState(null,"","?id="+encodeURIComponent(id));$("notice").textContent="Loading order…";stop=onSnapshot(doc(db,"orders",id),snap=>{if(!snap.exists()){clearTracking();$("notice").textContent="Order not found or you do not have access.";return}if(snap.data().customerUid!==auth.currentUser?.uid){clearTracking();$("notice").textContent="This order belongs to a different customer session.";return}render(snap.data())},e=>{clearTracking();$("notice").textContent="Unable to track this order: "+(e.code||e.message)+". Check your connection and Firestore rules."})}
$("track").addEventListener("click",track);$("orderId").value=new URLSearchParams(location.search).get("id")||"";
onAuthStateChanged(auth,async user=>{if(!user){try{await signInAnonymously(auth)}catch(e){$("notice").textContent="Sign-in unavailable: "+e.message}return}if($("orderId").value)track();else $("notice").textContent="Enter an order tracking ID."});
</script></body></html>
