<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kota Connect staging — Set password</title>
<style>body{font:16px system-ui;background:#f6f7f2;color:#203629;margin:0}main{max-width:460px;margin:8vh auto;padding:24px;background:white;border:1px solid #dce6db;border-radius:18px}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b9c9bc;border-radius:9px}button{margin-top:16px;padding:12px 18px;border:0;border-radius:9px;background:#176b42;color:white;font-weight:700}#message{white-space:pre-wrap}</style></head>
<body><main><h1>Kota Connect</h1><h2>Set your staging password</h2><p>This page is only for the isolated Neon development environment. Choose a unique password of at least 12 characters.</p>
<form id="reset"><label>New password</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label>Confirm password</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button type="submit">Set password</button></form><p id="message" role="status"></p><p><a href="neon-staging.html">Return to staging sign-in</a></p></main>
<script type="module">
import{createAuthClient}from"https://esm.sh/@neon/auth";
const auth=createAuthClient("https://ep-lively-leaf-za5rtfhs.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth");
const token=new URLSearchParams(location.search).get("token");
const form=document.getElementById("reset"),msg=document.getElementById("message");
if(!token){form.hidden=true;msg.textContent="This reset link is missing its token. Request a new password reset email from the staging administrator."}
form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){msg.textContent="Passwords do not match.";return}if(password.length<12){msg.textContent="Use at least 12 characters.";return}const r=await auth.resetPassword({newPassword:password,token});if(r.error){msg.textContent="Password reset failed: "+r.error.message;return}form.hidden=true;msg.textContent="Password set successfully. You can now sign in on the Kota Connect staging page."});
</script></body></html>
