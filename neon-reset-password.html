<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kota Connect | Reset administrator password</title><style>body{font:16px system-ui;background:#f5f8f5;color:#193425;margin:0}header{background:#176b45;color:#fff;padding:1rem}main{max-width:540px;margin:2rem auto;padding:1.5rem;background:white;border-radius:14px}label{display:block;margin:1rem 0}input{display:block;width:100%;box-sizing:border-box;padding:.8rem}button{background:#176b45;color:white;padding:.8rem;border:0;border-radius:8px}#result{white-space:pre-wrap}</style></head><body><header>Kota Connect — Account recovery (development staging)</header><main><h1>Set your account password</h1><p>Use this page only after opening the recovery link sent to your email. Your administrator permissions will not change.</p><form id="reset"><label>New password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input id="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Set password</button></form><p id="result" role="status"></p><p><a href="./neon-admin.html">Return to administrator sign-in</a></p></main><script type="module">
import { createAuthClient } from "https://esm.sh/@neon/auth@latest";
const auth=createAuthClient("https://ep-lively-leaf-za5rtfhs.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth",{fetchOptions:{credentials:"include"}});
const result=document.getElementById("result");
const params=new URLSearchParams(location.search);
if(params.get("error"))result.textContent="Recovery link failed or expired. Request another link from the administrator sign-in page.";
document.getElementById("reset").addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("password").value;
 if(password!==document.getElementById("confirm").value){result.textContent="Passwords do not match.";return;}
 const token=params.get("token");
 if(!token){result.textContent="Missing recovery token. Open the link in your recovery email.";return;}
 try{
  const r=await auth.resetPassword({newPassword:password,token});
  if(r.error)throw Error(r.error.message);
  result.textContent="Password set. Return to the administrator sign-in page and sign in.";
  document.getElementById("reset").reset();
  history.replaceState(null,"",location.pathname);
 }catch(error){result.textContent="Password reset failed: "+(error?.message||"Please request a new recovery link.");}
});
</script></body></html>
