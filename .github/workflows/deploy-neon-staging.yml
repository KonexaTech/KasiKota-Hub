name: Validate Neon staging candidate (deployment disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-candidate:
    if: github.ref == 'refs/heads/feature/neon-only-cutover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate candidate without hosted mutations
        run: |
          node --check worker/src/index.js
          node --check worker/src/neon-auth.js
          node --check worker/src/neon-api.js
          node --input-type=module --check < staging-preview/neon-app.js
          node --check staging-preview/kota-customer.mjs
          node --check staging-preview/kota-shop-registration.mjs
          cd worker
          npm run check
      - name: Report protected staging deployment gate
        run: |
          echo "::warning::Deployment disabled. No Worker or Pages deployment is performed by this workflow."
          echo "::notice::A separately reviewed deployment workflow must first verify Cloudflare Access and disable public alternate endpoints."
          echo "::notice::Full real owner-admin acceptance remains REQUIRED before controlled testing."
          echo "::notice::See separate 'Full Kota Connect owner-admin staging acceptance' workflow for the authoritative pass/fail result."
