name: Deploy Neon-only staging Worker
on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-only-cutover
    paths:
      - 'worker/**'
      - 'staging-preview/neon-app.js'
      - 'staging-preview/kota-shop-registration.mjs'
      - 'staging-preview/neon-admin.html'
      - 'staging-preview/neon-owner.html'
      - 'tests/neon-session-jwt.test.cjs'
      - 'tests/neon-security-static.test.cjs'
      - 'tests/neon-auth-proxy.test.mjs'
      - 'tests/verify-live-auth-http.mjs'
      - 'tests/verify-live-neon-owner-auth.mjs'
      - 'tests/verify-browser-owner-login.mjs'
      - 'tests/verify-browser-all-buttons.mjs'
      - 'tests/dashboard-buttons-audit.test.cjs'
      - 'tests/verify-live-guest-order.mjs'
      - 'worker/test/release-gates.integration.mjs'
      - '.github/workflows/deploy-neon-staging.yml'
jobs:
  staging:
    if: github.ref == 'refs/heads/feature/neon-only-cutover'
    runs-on: ubuntu-latest
    environment: neon-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker and auth client source
        run: |
          node --check worker/src/index.js
          node --check worker/src/neon-auth.js
          node --check worker/src/neon-api.js
 fix/kota-connect-full-audit-20261119
          node --input-type=module --check < staging-preview/neon-app.js
          node --test tests/neon-session-jwt.test.cjs
          node --test tests/neon-security-static.test.cjs
          node --test tests/neon-auth-proxy.test.mjs
          node --test worker/test/guest-auth.test.mjs
          node --test worker/test/role-policy.test.mjs

          node --check worker/src/guest-auth.js
          node --input-type=module --check < staging-preview/neon-app.js
          node --check staging-preview/kota-shop-registration.mjs
          node --test tests/neon-session-jwt.test.cjs
          node --test tests/neon-security-static.test.cjs
          node --test tests/neon-auth-proxy.test.mjs
          node --check tests/verify-live-guest-order.mjs
          node --check worker/test/release-gates.integration.mjs
 feature/neon-only-cutover
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Exercise recovery routing against staging Worker code
        working-directory: worker
        run: node --test test/recovery-routing.test.mjs
      - name: Deploy development Worker only
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "74fdd987dfadfdbb7322d9fc7f705499"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing staging Cloudflare token"; exit 1; }
          npx wrangler deploy --var "KOTA_SOURCE_COMMIT:$GITHUB_SHA"
      - name: Verify live staging password recovery route responses
        run: |
          node --input-type=module <<'NODE'
          const base="https://kota-connect-api-dev.siboniisozulu.workers.dev";
          for(const path of ["/password-reset-request","/password-reset"]){
            const response=await fetch(base+path,{redirect:"manual"});
            const page=await response.text();
            if(response.status!==200||!/text\/html/.test(response.headers.get("content-type")||"")||!page.includes("Kota Connect"))
              throw Error("Recovery route "+path+" did not return the staging HTML.");
          }
          const invalid=await fetch(base+"/password-reset/request",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:"invalid"})});
          if(invalid.status!==400)throw Error("Recovery request validation did not reject invalid emails.");
          const blocked=await fetch(base+"/password-reset-request",{headers:{Origin:"https://not-authorized.example"}});
          if(blocked.status!==403)throw Error("Recovery path must honor existing origin restrictions.");
          console.log("PASS: live password recovery pages, request validation and origin rules");
          NODE
      - name: Verify Neon staging health
        run: |
          curl --fail --silent --show-error https://kota-connect-api-dev.siboniisozulu.workers.dev/api/health | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const x=JSON.parse(s);if(!x.ok||x.backend!=="neon"||!x.authConfigured){console.error("Neon health failed:",JSON.stringify(x));process.exit(1)}console.log("Neon staging health passed")})'
      - name: Verify anonymous staging API access controls
        run: |
          node --input-type=module <<'NODE'
          const base="https://kota-connect-api-dev.siboniisozulu.workers.dev";
          const health=await fetch(base+"/api/health");
          if(health.status!==200)throw Error("Health HTTP "+health.status);
          const h=await health.json();
          if(h.ok!==true||h.backend!=="neon"||!h.authConfigured)throw Error("Neon health invalid");
          const catalog=await fetch(base+"/api/shops");
          if(catalog.status!==200)throw Error("Catalog HTTP "+catalog.status);
          const shops=await catalog.json();
          if(!Array.isArray(shops.shops))throw Error("Catalog missing shops");
          for(const route of ["/api/orders/mine","/api/owner/orders","/api/admin/orders","/api/notifications"]){
            const r=await fetch(base+route);
            if(r.status!==401)throw Error(route+" must reject anonymous users, got "+r.status);
          }
          const preflight=await fetch(base+"/api/orders",{method:"OPTIONS",headers:{Origin:"https://siboniisozulu-alt.github.io","Access-Control-Request-Method":"POST","Access-Control-Request-Headers":"authorization,content-type"}});
          if(!preflight.ok||preflight.headers.get("access-control-allow-origin")!=="https://siboniisozulu-alt.github.io")throw Error("Browser CORS preflight failed");
          console.log("Live anonymous staging API checks passed");
          NODE
 fix/kota-connect-full-audit-20261119
      - name: Verify live guest checkout, idempotency, R5 delivery and tracking
        run: node tests/verify-live-guest-order.mjs
      - name: Wait for the matching staging Pages frontend
        run: |
          url="https://kota-connect-neon-staging.pages.dev/neon-app.js?v=20261119-audit-fix-v1"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$url" | grep -q "Email verification required"; then
              echo "Matching staging frontend is deployed"

      - name: Verify live guest checkout, R5 delivery, idempotency and tracking
        run: node tests/verify-live-guest-order.mjs
      - name: Wait for matching Cloudflare Pages client
        run: |
          for attempt in $(seq 1 30); do
            page="$(curl --silent --show-error --fail https://kota-connect-neon-staging.pages.dev/neon-admin || true)"
            if printf '%s' "$page" | grep -q 'neon-app.js?v=20261122-fast-taps-bulk-read-v1'; then
              echo "Matching Pages dashboard client is live"
 feature/neon-only-cutover
              exit 0
            fi
            sleep 10
          done
 fix/kota-connect-full-audit-20261119
          echo "Staging Pages frontend did not reach the audited version in time"
          exit 1
      - name: Verify live Neon Auth proxy and unverified-account rejection

          echo "Cloudflare Pages did not publish the matching dashboard client"
          exit 1
      - name: Verify live Neon Auth and owner API
 feature/neon-only-cutover
        run: |
          node tests/verify-live-auth-http.mjs
          node tests/verify-live-neon-owner-auth.mjs
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install chromium
 fix/kota-connect-full-audit-20261119
      - name: Verify customer registration and owner/admin access gates in browser
        run: node tests/verify-browser-owner-login.mjs

      - name: Verify customer registration and owner/admin access gates in a real browser
        run: |
          node tests/verify-browser-owner-login.mjs
          node tests/verify-browser-all-buttons.mjs
      - name: Report separate mandatory real owner-admin acceptance
        run: |
          echo "::notice::Full real owner-admin acceptance is separately REQUIRED before closed testing. A successful staging deploy alone is not sufficient."
          echo "::notice::See separate 'Full Kota Connect owner-admin staging acceptance' workflow for the authoritative pass/fail result."
 feature/neon-only-cutover
