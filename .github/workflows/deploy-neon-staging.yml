name: Deploy reviewed Kota private staging candidate
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Full reviewed staging commit SHA (required for deployment, 40 characters)
        required: false
        type: string
      approve_private_deployment:
        description: Explicitly approve this exact private staging deployment
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: kota-private-staging-deployment
  cancel-in-progress: false
jobs:
  validate-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/neon-only-cutover' && inputs.approve_private_deployment != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check scripts/protected-deploy-preflight.mjs
          npm run check
      - run: echo 'Validation only. No hosted deployment.'
  deploy-private-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/neon-only-cutover' && inputs.approve_private_deployment == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: neon-staging
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact reviewed source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/neon-only-cutover
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install locked Worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate candidate
        working-directory: worker
        run: |
          node --check scripts/protected-deploy-preflight.mjs
          npm run check
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/kota-worker-dry-run"
      - name: Build source-matched Pages assets
        run: |
          node scripts/build-private-kota-qa.mjs
          test -f dist-kota-private-qa/_worker.js
          node -e 'if(require("./dist-kota-private-qa/qa-source.json").sourceCommit!==process.env.GITHUB_SHA)process.exit(1)'
      - name: Preflight, deploy and verify only the protected staging targets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.KOTA_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.KOTA_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          KOTA_STAGING_DATABASE_URL: ${{ secrets.KOTA_STAGING_DATABASE_URL }}
          KOTA_CF_ACCESS_CLIENT_ID: ${{ secrets.KOTA_CF_ACCESS_CLIENT_ID }}
          KOTA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.KOTA_CF_ACCESS_CLIENT_SECRET }}
          KOTA_CF_ACCESS_SERVICE_TOKEN_ID: ${{ vars.KOTA_CF_ACCESS_SERVICE_TOKEN_ID }}
          KOTA_STAGING_OWNER_EMAIL: ${{ secrets.KOTA_STAGING_OWNER_EMAIL }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          node worker/scripts/protected-deploy-preflight.mjs before
          umask 077
          SECRET_FILE="$(mktemp "$RUNNER_TEMP/kota-worker-secrets.XXXXXXXX.json")"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE
          node -e 'require("node:fs").writeFileSync(process.env.SECRET_FILE,JSON.stringify({DATABASE_URL:process.env.KOTA_STAGING_DATABASE_URL}),{mode:0o600})'
          # Fixed target in versioned config. Existing protected Access and bindings are required.
          (cd worker && npx --no-install wrangler deploy --keep-vars --var "KOTA_SOURCE_COMMIT:$GITHUB_SHA" --secrets-file "$SECRET_FILE")
          rm -f "$SECRET_FILE"
          worker/node_modules/.bin/wrangler pages deploy dist-kota-private-qa --project-name kota-connect-neon-staging --branch feature/neon-only-cutover --commit-hash "$GITHUB_SHA"
          node worker/scripts/protected-deploy-preflight.mjs after
      - name: Report limited acceptance
        run: echo "Private source deployment verified. Real test-order acceptance and physical Android testing are separate release gates."
