name: Full Kota Connect owner-admin staging acceptance
on:
  workflow_dispatch:
    inputs:
      confirm_test_writes:
        description: Authorize isolated staging TEST orders for this run only
        type: boolean
        required: true
        default: false
      create_fresh_test_shop:
        description: Create a new TEST shop/menu using existing staging test accounts; never change an existing merchant
        type: boolean
        required: false
        default: false
      verify_delivery_health:
        description: Verify the pinned Delivery staging health through the existing server service identity
        type: boolean
        required: false
        default: false
      expected_delivery_source:
        description: Exact reviewed Delivery staging source for requested health verification
        type: string
        required: false
        default: 2c415551214d6ba9b4140305417d41fac14f8723
      verify_routing:
        description: Perform one fixed-coordinate actual cycling-provider request using the server-only staging key
        type: boolean
        required: false
        default: false
      verify_delivery_roles:
        description: Verify real invited Delivery administrator and two approved bicycle-driver accounts; requires separate private credentials
        type: boolean
        required: false
        default: false
jobs:
  live-owner-admin:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/neon-only-cutover' && inputs.confirm_test_writes == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: neon-staging
    permissions:
      contents: read
    concurrency:
      group: kota-connect-full-staging-role-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real acceptance script
        run: |
          node --check worker/test/release-gates.integration.mjs
          node --check worker/test/prepare-staging-role-fixtures.mjs
      - name: Verify actual private Delivery application roles before any TEST-shop writes
        if: ${{ inputs.verify_delivery_roles }}
        env:
          DELIVERY_TEST_CONFIRM_PRIVATE_ROLES: 'true'
          DELIVERY_TEST_EXPECTED_SOURCE: ${{ inputs.expected_delivery_source }}
          DELIVERY_TEST_ACCESS_CLIENT_ID: ${{ secrets.DELIVERY_TEST_ACCESS_CLIENT_ID }}
          DELIVERY_TEST_ACCESS_CLIENT_SECRET: ${{ secrets.DELIVERY_TEST_ACCESS_CLIENT_SECRET }}
          DELIVERY_TEST_ADMIN_EMAIL: ${{ secrets.DELIVERY_TEST_ADMIN_EMAIL }}
          DELIVERY_TEST_ADMIN_PASSWORD: ${{ secrets.DELIVERY_TEST_ADMIN_PASSWORD }}
          DELIVERY_TEST_DRIVER_EMAIL: ${{ secrets.DELIVERY_TEST_DRIVER_EMAIL }}
          DELIVERY_TEST_DRIVER_PASSWORD: ${{ secrets.DELIVERY_TEST_DRIVER_PASSWORD }}
          DELIVERY_TEST_OTHER_DRIVER_EMAIL: ${{ secrets.DELIVERY_TEST_OTHER_DRIVER_EMAIL }}
          DELIVERY_TEST_OTHER_DRIVER_PASSWORD: ${{ secrets.DELIVERY_TEST_OTHER_DRIVER_PASSWORD }}
        run: node worker/test/private-delivery-roles.mjs
      - name: Prepare a fresh labelled TEST shop only when explicitly requested
        id: fresh_fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_fresh_test_shop }}
        env:
          KOTA_PREPARE_FRESH_TEST_SHOP: ${{ inputs.create_fresh_test_shop && 'true' || 'false' }}
          KOTA_TEST_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          KOTA_TEST_API_BASE: https://kota-connect-api-dev.siboniisozulu.workers.dev
          KOTA_CF_ACCESS_CLIENT_ID: ${{ secrets.KOTA_CF_ACCESS_CLIENT_ID }}
          KOTA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.KOTA_CF_ACCESS_CLIENT_SECRET }}
          KOTA_TEST_OWNER_EMAIL: ${{ secrets.KOTA_TEST_OWNER_EMAIL }}
          KOTA_TEST_OWNER_PASSWORD: ${{ secrets.KOTA_TEST_OWNER_PASSWORD }}
          KOTA_TEST_ADMIN_EMAIL: ${{ secrets.KOTA_TEST_ADMIN_EMAIL }}
          KOTA_TEST_ADMIN_PASSWORD: ${{ secrets.KOTA_TEST_ADMIN_PASSWORD }}
        run: node worker/test/prepare-staging-role-fixtures.mjs
      - name: Run real signed-in owner and administrator acceptance
        env:
          KOTA_TEST_VERIFY_ROUTING: ${{ inputs.verify_routing && 'true' || 'false' }}
          KOTA_TEST_VERIFY_DELIVERY_HEALTH: ${{ inputs.verify_delivery_health && 'true' || 'false' }}
          KOTA_TEST_EXPECTED_DELIVERY_SOURCE: ${{ inputs.expected_delivery_source }}
          KOTA_TEST_CONFIRM_WRITES: ${{ inputs.confirm_test_writes && 'true' || 'false' }}
          KOTA_TEST_SHOP_ID: ${{ steps.fresh_fixture.outputs.shop_id || vars.KOTA_TEST_SHOP_ID }}
          KOTA_TEST_MENU_ITEM_ID: ${{ steps.fresh_fixture.outputs.menu_item_id || vars.KOTA_TEST_MENU_ITEM_ID }}
          KOTA_TEST_OWNER_SUBJECT: ${{ steps.fresh_fixture.outputs.owner_subject || vars.KOTA_TEST_OWNER_SUBJECT }}
          KOTA_TEST_ADMIN_SUBJECT: ${{ steps.fresh_fixture.outputs.admin_subject || vars.KOTA_TEST_ADMIN_SUBJECT }}
          KOTA_TEST_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          KOTA_TEST_API_BASE: https://kota-connect-api-dev.siboniisozulu.workers.dev
          KOTA_CF_ACCESS_CLIENT_ID: ${{ secrets.KOTA_CF_ACCESS_CLIENT_ID }}
          KOTA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.KOTA_CF_ACCESS_CLIENT_SECRET }}
          KOTA_TEST_OWNER_EMAIL: ${{ secrets.KOTA_TEST_OWNER_EMAIL }}
          KOTA_TEST_OWNER_PASSWORD: ${{ secrets.KOTA_TEST_OWNER_PASSWORD }}
          KOTA_TEST_ADMIN_EMAIL: ${{ secrets.KOTA_TEST_ADMIN_EMAIL }}
          KOTA_TEST_ADMIN_PASSWORD: ${{ secrets.KOTA_TEST_ADMIN_PASSWORD }}
        run: node worker/test/release-gates.integration.mjs

      - name: Install browser acceptance tools for fresh fixtures only
        if: ${{ inputs.create_fresh_test_shop }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.65.1
          npx --no-install playwright install --with-deps chromium
      - name: Exercise actual protected browser screens and guest pickup journey
        if: ${{ inputs.create_fresh_test_shop }}
        env:
          DEBUG: ''
          PWDEBUG: '0'
          KOTA_PREPARE_FRESH_TEST_SHOP: ${{ inputs.create_fresh_test_shop && 'true' || 'false' }}
          KOTA_TEST_CONFIRM_WRITES: ${{ inputs.confirm_test_writes && 'true' || 'false' }}
          KOTA_TEST_SHOP_ID: ${{ steps.fresh_fixture.outputs.shop_id }}
          KOTA_TEST_MENU_ITEM_ID: ${{ steps.fresh_fixture.outputs.menu_item_id }}
          KOTA_TEST_OWNER_SUBJECT: ${{ steps.fresh_fixture.outputs.owner_subject }}
          KOTA_TEST_ADMIN_SUBJECT: ${{ steps.fresh_fixture.outputs.admin_subject }}
          KOTA_TEST_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          KOTA_TEST_API_BASE: https://kota-connect-api-dev.siboniisozulu.workers.dev
          KOTA_CF_ACCESS_CLIENT_ID: ${{ secrets.KOTA_CF_ACCESS_CLIENT_ID }}
          KOTA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.KOTA_CF_ACCESS_CLIENT_SECRET }}
          KOTA_TEST_OWNER_EMAIL: ${{ secrets.KOTA_TEST_OWNER_EMAIL }}
          KOTA_TEST_OWNER_PASSWORD: ${{ secrets.KOTA_TEST_OWNER_PASSWORD }}
          KOTA_TEST_ADMIN_EMAIL: ${{ secrets.KOTA_TEST_ADMIN_EMAIL }}
          KOTA_TEST_ADMIN_PASSWORD: ${{ secrets.KOTA_TEST_ADMIN_PASSWORD }}
        run: node tests/protected-live-browser.mjs
