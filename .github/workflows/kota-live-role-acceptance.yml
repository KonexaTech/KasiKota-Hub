name: Full Kota Connect owner-admin staging acceptance
on:
  workflow_dispatch:
    inputs:
      confirm_test_writes:
        description: Authorize isolated staging TEST orders for this run only
        type: boolean
        required: true
        default: false
      create_fresh_test_shop:
        description: Create a new TEST shop/menu using existing staging test accounts; never change an existing merchant
        type: boolean
        required: false
        default: false
jobs:
  live-owner-admin:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/neon-only-cutover' && inputs.confirm_test_writes == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: neon-staging
    permissions:
      contents: read
    concurrency:
      group: kota-connect-full-staging-role-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real acceptance script
        run: |
          node --check worker/test/release-gates.integration.mjs
          node --check worker/test/prepare-staging-role-fixtures.mjs
      - name: Prepare a fresh labelled TEST shop only when explicitly requested
        id: fresh_fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_fresh_test_shop }}
        env:
          KOTA_PREPARE_FRESH_TEST_SHOP: ${{ inputs.create_fresh_test_shop && 'true' || 'false' }}
          KOTA_TEST_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          KOTA_TEST_API_BASE: https://kota-connect-api-dev.siboniisozulu.workers.dev
          KOTA_TEST_OWNER_EMAIL: ${{ secrets.KOTA_TEST_OWNER_EMAIL }}
          KOTA_TEST_OWNER_PASSWORD: ${{ secrets.KOTA_TEST_OWNER_PASSWORD }}
          KOTA_TEST_ADMIN_EMAIL: ${{ secrets.KOTA_TEST_ADMIN_EMAIL }}
          KOTA_TEST_ADMIN_PASSWORD: ${{ secrets.KOTA_TEST_ADMIN_PASSWORD }}
        run: node worker/test/prepare-staging-role-fixtures.mjs
      - name: Run real signed-in owner and administrator acceptance
        env:
          KOTA_TEST_CONFIRM_WRITES: ${{ inputs.confirm_test_writes && 'true' || 'false' }}
          KOTA_TEST_SHOP_ID: ${{ steps.fresh_fixture.outputs.shop_id || vars.KOTA_TEST_SHOP_ID }}
          KOTA_TEST_MENU_ITEM_ID: ${{ steps.fresh_fixture.outputs.menu_item_id || vars.KOTA_TEST_MENU_ITEM_ID }}
          KOTA_TEST_OWNER_SUBJECT: ${{ steps.fresh_fixture.outputs.owner_subject || vars.KOTA_TEST_OWNER_SUBJECT }}
          KOTA_TEST_ADMIN_SUBJECT: ${{ steps.fresh_fixture.outputs.admin_subject || vars.KOTA_TEST_ADMIN_SUBJECT }}
          KOTA_TEST_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          KOTA_TEST_API_BASE: https://kota-connect-api-dev.siboniisozulu.workers.dev
          KOTA_TEST_OWNER_EMAIL: ${{ secrets.KOTA_TEST_OWNER_EMAIL }}
          KOTA_TEST_OWNER_PASSWORD: ${{ secrets.KOTA_TEST_OWNER_PASSWORD }}
          KOTA_TEST_ADMIN_EMAIL: ${{ secrets.KOTA_TEST_ADMIN_EMAIL }}
          KOTA_TEST_ADMIN_PASSWORD: ${{ secrets.KOTA_TEST_ADMIN_PASSWORD }}
        run: node worker/test/release-gates.integration.mjs
