name: Build Neon staging Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-only-cutover
      - repair/integrated-beta-20261127
      - repair/kota-android-location-20261127
permissions:
  contents: read
jobs:
  android-debug:
    if: github.ref == 'refs/heads/feature/neon-only-cutover' || github.ref == 'refs/heads/repair/integrated-beta-20261127' || github.ref == 'refs/heads/repair/kota-android-location-20261127'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: android-staging
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor Android project
        working-directory: android-staging
        run: npm run build:android
      - name: Require Android 8.0 or later
        working-directory: android-staging/android
        run: |
          sed -i 's/minSdkVersion = [0-9][0-9]*/minSdkVersion = 26/' variables.gradle
          grep -q 'minSdkVersion = 26' variables.gradle
      - name: Apply Kota Connect branded Android launcher icon
        run: node android-staging/scripts/apply-launcher-icon.mjs
      - name: Declare foreground location access for customer GPS capture
        run: node android-staging/scripts/apply-location-permissions.mjs
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: neon-android-gradle-${{ runner.os }}-${{ hashFiles('android-staging/package-lock.json') }}
          restore-keys: |
            neon-android-gradle-${{ runner.os }}-
      - name: Remove unused Firebase Google Services plugin
        working-directory: android-staging/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('build.gradle','app/build.gradle'):
              p=Path(filename)
              if not p.exists(): continue
              s=p.read_text()
              lines=[line for line in s.splitlines(keepends=True) if not ('com.google.gms:google-services' in line or 'apply plugin: \'com.google.gms.google-services\'' in line or 'id \'com.google.gms.google-services\'' in line)]
              p.write_text(''.join(lines))
          PY
      - name: Configure owner-pinned staging signing when supplied
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover'
        env:
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
          ANDROID_STAGING_STORE_PASSWORD: ${{ secrets.ANDROID_STAGING_STORE_PASSWORD }}
          ANDROID_STAGING_KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
          ANDROID_STAGING_KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_KEY_PASSWORD }}
          ANDROID_STAGING_CERT_SHA256: ${{ vars.ANDROID_STAGING_CERT_SHA256 }}
        run: node scripts/android-staging-signing.mjs android-staging/android/app/build.gradle
      - name: Build debug APK with bounded dependency retries
        working-directory: android-staging/android
        env:
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_KEYSTORE_BASE64 || '' }}
          ANDROID_STAGING_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_STORE_PASSWORD || '' }}
          ANDROID_STAGING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_KEY_ALIAS || '' }}
          ANDROID_STAGING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_KEY_PASSWORD || '' }}
          ANDROID_STAGING_CERT_SHA256: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && vars.ANDROID_STAGING_CERT_SHA256 || '' }}
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --max-workers=2 assembleDebug; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 45))
          done
      - name: Verify branded Android APK was generated
        run: |
          test -s android-staging/android/app/build/outputs/apk/debug/app-debug.apk
          test -s android-staging/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test ! -e android-staging/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Verify signing, supported Android version and artifact provenance
        run: |
          mkdir -p device-artifact
          APK=android-staging/android/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > device-artifact/signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > device-artifact/package.txt
          grep -q "package: name='za.co.kotaconnect.staging'" device-artifact/package.txt
          grep -q "sdkVersion:'26'" device-artifact/package.txt
          grep -q "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'" device-artifact/package.txt
          grep -q "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" device-artifact/package.txt
          node scripts/android-staging-signing.mjs verify device-artifact/signature.txt device-artifact/signing-mode.json
          sha256sum "$APK" > device-artifact/sha256.txt
          printf '%s\n' "$GITHUB_SHA" > device-artifact/source-commit.txt
          cp "$APK" device-artifact/Kota-Connect-staging.apk
          printf '%s\n' 'Private staging wrapper; inspect signing-mode.json. Exact hosted API/Pages acceptance, Access login, physical installation, GPS, notifications and upgrade signing remain unverified. No real payments.' > device-artifact/READ-ME.txt
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: kota-connect-neon-staging-debug-apk
          path: device-artifact/
          if-no-files-found: error
      - name: Remove only this job's temporary signing material
        if: always() && env.KONEXA_STAGING_KEYSTORE_PATH != ''
        run: rm -f -- "$KONEXA_STAGING_KEYSTORE_PATH"
