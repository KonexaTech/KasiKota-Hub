name: Build Neon staging Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-only-cutover
jobs:
  android-debug:
    if: github.ref == 'refs/heads/feature/neon-only-cutover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: android-staging
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor Android project
        working-directory: android-staging
        run: npm run build:android
      - name: Build debug APK
        working-directory: android-staging/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: kota-connect-neon-staging-debug-apk
          path: android-staging/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
