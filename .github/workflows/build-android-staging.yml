name: Build Kota Connect Android staging APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-only-cutover
    paths:
      - 'neon-staging.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-android-staging.yml'
      - 'worker/src/**'
      - 'worker/wrangler.jsonc'
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android web app
        run: node scripts/prepare-android.mjs
      - name: Add Android platform
        run: npx cap add android
      - name: Build and sync Android web app
        run: npm run build:android
      - name: Declare foreground location access
        run: node android-staging/scripts/apply-location-permissions.mjs android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kota-connect-neon-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
