name: Build Kota Connect Android staging APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-only-cutover
    paths:
      - 'neon-staging.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-android-staging.yml'
      - 'worker/src/**'
      - 'worker/wrangler.jsonc'
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android web app
        run: node scripts/prepare-android.mjs
      - name: Add Android platform
        run: npx cap add android
      - name: Build and sync Android web app
        run: npm run build:android
      - name: Declare foreground location access
        run: node android-staging/scripts/apply-location-permissions.mjs android/app/src/main/AndroidManifest.xml
      - name: Configure owner-pinned staging signing when supplied
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover'
        env:
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
          ANDROID_STAGING_STORE_PASSWORD: ${{ secrets.ANDROID_STAGING_STORE_PASSWORD }}
          ANDROID_STAGING_KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
          ANDROID_STAGING_KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_KEY_PASSWORD }}
          ANDROID_STAGING_CERT_SHA256: ${{ vars.ANDROID_STAGING_CERT_SHA256 }}
        run: node scripts/android-staging-signing.mjs android/app/build.gradle
      - name: Build debug APK
        env:
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_KEYSTORE_BASE64 || '' }}
          ANDROID_STAGING_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_STORE_PASSWORD || '' }}
          ANDROID_STAGING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_KEY_ALIAS || '' }}
          ANDROID_STAGING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && secrets.ANDROID_STAGING_KEY_PASSWORD || '' }}
          ANDROID_STAGING_CERT_SHA256: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/neon-only-cutover' && vars.ANDROID_STAGING_CERT_SHA256 || '' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify pinned signer of generic staging APK
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/kota-signature.txt"
          node scripts/android-staging-signing.mjs verify "$RUNNER_TEMP/kota-signature.txt" "$RUNNER_TEMP/kota-signing-mode.json"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kota-connect-neon-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's temporary signing material
        if: always() && env.KONEXA_STAGING_KEYSTORE_PATH != ''
        run: rm -f -- "$KONEXA_STAGING_KEYSTORE_PATH"
