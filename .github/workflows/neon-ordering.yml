name: Neon-only ordering checks
on:
  pull_request:
  push:
    branches:
      - feature/neon-only-cutover
  workflow_dispatch:
jobs:
  neon-ordering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Neon Worker and ordering scripts
        run: |
          node --check worker/src/index.js
          node --check worker/src/neon-api.js
          node --check worker/src/neon-auth.js
          node --check worker/src/guest-auth.js
          node --check staging-preview/kota-customer.mjs
          node --check staging-preview/shop-discovery.mjs
          node --test tests/postmerge-integrity.test.mjs
          node --test tests/customer-journey.test.mjs
          node --test tests/three-experiences-static.test.cjs
          node --test worker/test/guest-auth.test.mjs
          node --input-type=module --check < staging-preview/neon-app.js
          node --test tests/status-sync.test.cjs
          node --check tests/neon-ordering-only.test.cjs
          node tests/neon-ordering-only.test.cjs
          node tests/customer-price-confirm.test.cjs
          node --test tests/neon-session-jwt.test.cjs
          node --test tests/neon-auth-proxy.test.mjs
          node --test tests/neon-security-static.test.cjs
      - name: Verify live staging Auth and API routes
        if: github.event_name == 'workflow_dispatch'
        run: |
          node tests/verify-live-auth-http.mjs
          node tests/verify-live-neon-owner-auth.mjs
      - name: Verify approved owner dashboard in a real browser
        if: github.event_name == 'workflow_dispatch'
        env:
          KOTA_TEST_OWNER_EMAIL: ${{ secrets.KOTA_TEST_OWNER_EMAIL }}
          KOTA_TEST_OWNER_PASSWORD: ${{ secrets.KOTA_TEST_OWNER_PASSWORD }}
        run: |
          if [ -z "$KOTA_TEST_OWNER_EMAIL" ] || [ -z "$KOTA_TEST_OWNER_PASSWORD" ]; then
            echo "SKIP: configure optional approved-owner test credentials to run this browser acceptance test."
            exit 0
          fi
          npm install --no-save playwright
          npx playwright install chromium
          node tests/verify-browser-owner-login.mjs
