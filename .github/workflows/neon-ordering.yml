name: Neon-only ordering checks
on:
  pull_request:
  push:
    branches:
      - feature/neon-only-cutover
jobs:
  neon-ordering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Neon Worker and customer ordering scripts
        run: |
          node --check worker/src/index.js
          node --check worker/src/neon-api.js
          node --check worker/src/neon-auth.js
          node --check worker/src/guest-auth.js
          node --input-type=module --check < staging-preview/neon-app.js
          node --check staging-preview/kota-customer.mjs
          node --check staging-preview/shop-discovery.mjs
          node --check staging-preview/kota-shop-registration.mjs
          node --check tests/verify-live-auth-http.mjs
          node --check tests/verify-live-neon-owner-auth.mjs
          node --check tests/verify-live-guest-order.mjs
          node --check tests/verify-browser-owner-login.mjs
          node --check worker/test/release-gates.integration.mjs
          node --test tests/postmerge-integrity.test.mjs
          node --test tests/customer-journey.test.mjs
          node --test tests/customer-price-confirm.test.cjs
          node --test tests/three-experiences-static.test.cjs
          node --test tests/status-sync.test.cjs
          node tests/neon-ordering-only.test.cjs
          node --test tests/neon-session-jwt.test.cjs
          node --test tests/neon-security-static.test.cjs
          node --test tests/neon-auth-proxy.test.mjs
          node --test worker/test/guest-auth.test.mjs
          node --test worker/test/role-policy.test.mjs
