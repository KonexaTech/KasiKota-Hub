name: Kota Connect ordering checks
on:
  pull_request:
  push:
    branches:
      - feature/kota-ordering-release-gates
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ordering and dashboard integration
        run: |
          node --check worker/src/index.js
          node --check worker/src/privileged.js
          node --check worker/src/neon-auth.js
          node --check worker/src/neon-api.js
          node --input-type=module --check < neon-app.js
          node --check android-staging/scripts/prepare-web.mjs
          node -e 'const c=require("./android-staging/capacitor.config.json");if(!c.appId||c.webDir!=="www")process.exit(1)'
          node tests/browser-script-syntax.cjs
          node tests/ordering-static.test.cjs
          node --test tests/neon-security-static.test.cjs
          node scripts/audit-firebase-export.mjs tests/fixtures/firebase-export-sample.json
