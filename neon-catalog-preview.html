<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kota Connect — Neon Catalog Preview</title>
<style>body{font:16px system-ui;background:#f4f8f5;color:#15291c;margin:0}header{background:#176b45;color:white;padding:22px}main{max-width:700px;margin:auto;padding:18px}.card{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 12px #0001}button,input{padding:12px;border-radius:8px;border:1px solid #bbb}button{background:#176b45;color:white;cursor:pointer}button:disabled{opacity:.5}input{width:95%}.muted{color:#526259}#status{padding:10px}</style>
<header><h2>🥪 Kota Connect</h2><p>Neon + Cloudflare catalog preview</p></header>
<main><div class="card"><label for="api">Cloudflare Worker HTTPS URL</label><input id="api" type="url" placeholder="https://your-worker.workers.dev"><p class="muted">Use the deployed development Worker URL. No database passwords are entered here.</p><button id="load">Load approved shops</button></div><p id="status" role="status">Enter your Worker URL to preview Neon shop data.</p><div id="shops"></div><p class="muted">Read-only development preview. Checkout and tracking will be enabled after authenticated APIs pass security tests.</p></main>
<script>
const $=id=>document.getElementById(id);
const money=cents=>'R'+(cents/100).toFixed(2);
const base=()=>{const value=$('api').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(value))throw Error('Enter a valid HTTPS Worker origin');return value};
async function fetchJson(path){const response=await fetch(base()+path);if(!response.ok)throw Error('API returned HTTP '+response.status);return response.json()}
$('load').addEventListener('click',async()=>{const list=$('shops');list.replaceChildren();$('status').textContent='Loading shops…';try{const data=await fetchJson('/api/shops');if(!Array.isArray(data.shops))throw Error('Invalid shops response');$('status').textContent=data.shops.length+' approved shop(s) found';for(const shop of data.shops){const card=document.createElement('section');card.className='card';const title=document.createElement('h3');title.textContent=shop.name;const area=document.createElement('p');area.textContent=shop.area;const menu=document.createElement('div');const button=document.createElement('button');button.textContent='View menu';button.onclick=async()=>{menu.textContent='Loading menu…';try{const result=await fetchJson('/api/shops/'+encodeURIComponent(shop.id)+'/menu');menu.replaceChildren();for(const item of result.items||[]){const row=document.createElement('p');row.textContent=item.name+' — '+money(item.price_cents);menu.append(row)}if(!result.items?.length)menu.textContent='No available menu items'}catch(e){menu.textContent=e.message}};card.append(title,area,button,menu);list.append(card)}}catch(e){$('status').textContent='Unable to load shops: '+e.message}});
</script></html>
